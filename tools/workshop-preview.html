<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RedVelvet — Shared workshop QA</title><base href="/">
<style>body{margin:24px;background:#181a20;color:#eee8db;font:14px system-ui;display:flex;align-items:flex-start;gap:28px;}aside{max-width:280px;}aside p{line-height:1.6;}aside button,aside a{display:block;margin:10px 0;padding:9px 14px;border:1px solid #ad8c51;border-radius:8px;background:#30271d;color:#ffe6aa;text-decoration:none;}aside select{margin:8px;background:#30271d;color:#fff0cb;} .app.rvc-app{width:460px;}.window-header{font:14px system-ui;padding:12px 15px;}.app.rv-crafting-dialog{width:430px;border:1px solid #9b7b42;border-radius:12px;overflow:hidden;}.rv-crafting-dialog>.window-header{background:#302619;}.window-content{padding:0;}@media(max-width:800px){body{flex-direction:column;}}</style>
<aside><h1>RedVelvet Crafting</h1><p>Prueba visual con inventario simulado. Se ejecuta el módulo real; esta página no modifica un mundo de Foundry.</p><p id="edition"></p><a href="tools/workshop-preview.html?system=dnd5e">D&D5e · Principal</a><a href="tools/workshop-preview.html?system=pf2e">PF2e · Principal</a><a href="tools/workshop-preview.html?system=dnd5e&mode=extended">D&D5e · Secundario</a><a href="tools/workshop-preview.html?system=pf2e&mode=extended">PF2e · Secundario</a><label>Tirada natural <select id="die"><option>20</option><option>10</option><option>1</option></select></label><button id="reopen">Abrir taller</button><p id="wallet"></p><p id="notices"></p></aside>
<script src="node_modules/jquery/dist/jquery.min.js"></script><script type="module">
import {installEnvironment} from './tests/fixture.mjs';
const params=new URLSearchParams(location.search),system=params.get('system')==='pf2e'?'pf2e':'dnd5e',mode=params.get('mode')==='extended'?'extended':'core',moduleId=`redvelvet-crafting-${system}`,root=`modules/${moduleId}`;
for(const file of ['core-crafting','crafting']){const link=document.createElement('link');link.rel='stylesheet';link.href=`${root}/styles/${file}.css`;document.head.append(link);}
const env=installEnvironment({window,jquery:window.jQuery,generation:14});env.craftingMode=mode;game.system.id=system;
game.modules.set(moduleId,{id:moduleId,active:true,title:'RedVelvet Crafting'});
const messages=await (await fetch(`${root}/lang/es.json`)).json();game.i18n.format=(key,data={})=>(messages[key]??key).replace(/\{(\w+)\}/g,(_,name)=>String(data[name]??`{${name}}`));game.i18n.localize=key=>messages[key]??key;
foundry.utils={debounce:(fn,ms)=>{let timer;return(...args)=>{clearTimeout(timer);timer=setTimeout(()=>fn(...args),ms);};},escapeHTML:value=>String(value).replace(/[<>]/g,'')};
class ApplicationV2 {constructor(options){this.options=options;}async render(){this.element=document.createElement('div');this.element.className='app rvc-app';this.element.innerHTML=`<header class="window-header">${this.options.window.title}</header><div class="window-content"></div>`;this._replaceHTML(await this._renderHTML(),this.element.querySelector('.window-content'));document.body.append(this.element);this._onRender({},{});return this;}bringToFront(){}async close(){this.element.remove();}}
foundry.applications.api.ApplicationV2=ApplicationV2;
await env.seed();const actor=env.actor;actor.system.currency={pp:0,gp:100,ep:0,sp:0,cp:0};actor.system.skills.crafting={rank:2,totalModifier:9};actor.skills={crafting:{mod:9}};
actor.update=async patches=>{for(const [path,value] of Object.entries(patches)){const keys=path.split('.');let target=actor;for(const key of keys.slice(0,-1))target=target[key]??={};target[keys.at(-1)]=value;}return actor;};
const coins={copperValue:10000};actor.inventory={coins,removeCoins:async({cp})=>{if(coins.copperValue<cp)return false;coins.copperValue-=cp;return true;},addCoins:async c=>{coins.copperValue+=(c.gp??0)*100+(c.sp??0)*10+(c.cp??0);}};
await actor.createEmbeddedDocuments('Item',['alchemist','jeweler','leatherworker','weaver','glassblower'].map(id=>({name:`${id} tools`,type:'tool',system:{quantity:1,type:{baseItem:id}}})));
const icon=`${root}/assets/icons/blacksmith-materials.svg`;
const source=(id,name,type,price,level=4)=>({uuid:`Compendium.qa.gear.Item.${id}`,name,type,img:icon,system:{quantity:20,equipped:true,rarity:'common',level:{value:level},traits:{rarity:'common',value:[]},price:system==='pf2e'?{value:{gp:price},per:1}:{value:price,denomination:'gp'}},toObject(){return {_id:id,name,type,img:this.img,system:structuredClone(this.system)};}});
const recipes=[source('sword','Espada larga','weapon',50),source('dagger','Daga','weapon',2,0),source('axe','Hacha de batalla','weapon',10,0),source('shield','Escudo de acero',system==='pf2e'?'shield':'equipment',20,0),source('potion','Poción de curación','consumable',50),source('ring','Anillo de plata','equipment',25),source('cloak','Capa de viaje','equipment',5),source('kit','Herramientas de aventura',system==='pf2e'?'equipment':'tool',15)];
env.documents=new Map(recipes.map(doc=>[doc.uuid,doc]));game.packs=[{documentName:'Item',visible:true,title:'Recetas de prueba',collection:'qa.gear',getIndex:async()=>recipes}];game.items=[];
await import(`/${root}/scripts/crafting-dialog.js`);await env.fire('init');await env.fire('ready');
let app=game.modules.get(moduleId).api.open();document.querySelector('#edition').textContent=`${system.toUpperCase()} · ${mode==='core'?'Principal':'Secundario'}`;
document.querySelector('#reopen').onclick=()=>app=game.modules.get(moduleId).api.open();document.querySelector('#die').onchange=event=>env.rollResult=Number(event.target.value);
setInterval(()=>{const purse=system==='pf2e'?coins.copperValue:actor.system.currency.gp*100+actor.system.currency.sp*10+actor.system.currency.cp;document.querySelector('#wallet').textContent=`Monedas: ${purse/100} po · Objetos fabricados: ${actor.items.filter(it=>it.name==='Espada larga').length}`;document.querySelector('#notices').textContent=env.notices.at(-1)??'';},250);
</script></html>
